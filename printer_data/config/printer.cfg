# [gcode_macro M106]
# gcode:
#     {% set fan = 'fan' + (params.P|int if params.P is defined else 0)|string %}
#     {% set speed = (params.S|float / 255 if params.S is defined else 1.0) %}
#     SET_FAN_SPEED FAN={fan} SPEED={speed}

[gcode_macro M106]
description: "Set fan speed (Orca compatible)"
gcode:
    # Связываем индексы OrcaSlicer с точными именами из вашего конфига
    {% set fan_map = {
        0: "fan0",      # Orca P0 → CPAP blower
        2: "fan2",     # Uncomment if you define AUX
        3: "exhaust_fan",   # Orca P3 → Exhaust
    } %}
    {% set p = params.P|int if 'P' in params else 0 %}
    # Если передан неизвестный P, по умолчанию используем fan0 (основной обдув)
    {% set fan = fan_map.get(p, "fan0") %}
    {% set speed = (params.S|float / 255 if 'S' in params else 1.0) %}
    SET_FAN_SPEED FAN={fan} SPEED={speed}
    
[gcode_macro M107]
description: "Turn off fan (Orca compatible)"
gcode:
    {% set fan_map = {
        0: "fan0",
        2: "fan2",
        3: "exhaust_fan"
    } %}
    {% set p = params.P|int if 'P' in params else 0 %}
    {% set fan = fan_map.get(p, "fan0") %}
    
    SET_FAN_SPEED FAN={fan} SPEED=0.0
    
#####################################################################
##                            PID macro
#####################################################################

[gcode_macro PID_EXTRUDER] 
gcode:
  #STOP_LED_EFFECTS
  #SET_LED_EFFECT EFFECT=nagrev_soplo
  {% set TARGET_TEMP = params.TARGET_TEMP|default(260)|float %}
  PID_CALIBRATE HEATER=extruder TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS 
  SAVE_CONFIG

[gcode_macro PID_BED] 
gcode:
  #STOP_LED_EFFECTS
  #SET_LED_EFFECT EFFECT=nagrev_stol
  {% set TARGET_TEMP = params.TARGET_TEMP|default(105)|float %}
  PID_CALIBRATE HEATER=heater_bed TARGET={TARGET_TEMP}
  TURN_OFF_HEATERS 
  SAVE_CONFIG
  
[gcode_macro Z_TILT_ADJUST]     # IDM/Cartographer optimized 3Z leveling macro
rename_existing: _Z_TILT_ADJUST
gcode:
    SAVE_GCODE_STATE NAME=STATE_Z_TILT         # Save current state for Z tilt adjustment
    BED_MESH_CLEAR                             # Clear bed mesh
    {% if not printer.z_tilt.applied %}
      _Z_TILT_ADJUST horizontal_move_z=10 retry_tolerance=1   # Adjust Z tilt with higher tolerance initially
    {% endif %}
    _Z_TILT_ADJUST horizontal_move_z=2          # Fine-tune Z tilt adjustment
    RESTORE_GCODE_STATE NAME=STATE_Z_TILT       # Restore saved state after adjustment




####################################################################################
##                                    Homing Override
####################################################################################
[homing_override]
axes: z                    # Override homing for the Z axis only
set_position_z: 0           # Set the Z position to 0 after homing
gcode:
    G90                     # Set to absolute positioning mode
    G0 Z10 F1200            # Move Z axis to 10mm above the bed at 1200 mm/min
    G28 Y                   # Home Y axis
    G28 X                   # Home X axis
    G1 X150 Y150 F7200      # Move to a specific coordinate (125, 125) at 7200 mm/min
    G28 Z                   # Home Z axis again
    G0 Z10 F1200
####################################################################################
##                                    Z Tilt Adjustment
####################################################################################
[z_tilt]
##  Use Z_TILT_ADJUST to level the bed.
##  z_positions: Location of toolhead
z_positions:
   -50, 18
   150, 348
   350, 18
points:
   50, 50
   150, 250
   250, 50
##--------------------------------------------------------------------

speed: 350                 # Speed of Z tilt adjustment
horizontal_move_z: 2       # Z axis move speed for adjustments
retries: 10                # Number of retries for adjustment points
retry_tolerance: 0.015    # Retry tolerance for adjustment accuracy

####################################################################################
####################################################################################

[motors_sync]
axes: x,y
#    Оси на которых будет производиться калибровка.
accel_chip:adxl345
#    Aкселерометр для сбора вибраций: adxl345 / mpu9250 и т.п.
#encoder_chip_<axis>:
#    Ось, присвоенное имя энкодеру, для замера отклонений.
chip_filter: median
#    Тип фильтра данных акселерометра: 'median' обычно хватает, но особо
#    шумные принтеры (вентиляторов, и т.п.) могут потребовать более мощный
#    фильтр - 'kalman'. Для lis2dw фильтры отключены.
#median_size: 3
#    Размер окна медианного фильтра.
#kalman_coeffs: 1.1, 1., 1e-1, 1e-2, .5, 1.
#    Простые коэффициенты, описывающие фильтр Калмана.
microsteps: 16
#    Максимальное дробление смещения ротора шагового двигателя.
#sync_method: default
#    Методы синхронизации двух осей во взаимосвязанной кинематике:
#    'alternately' - оси калибруются чередуясь, шаг за шагом. (default)
#    'synchronous' - оси калибруются в зависимости от своей магнитуды,
#    стараясь поддерживать её на одном уровене.
#    Методы синхронизации оси/осей в НЕвзаимосвязанной кинематике:
#    'sequential' - оси калибруются последовательно. (default)
steps_model: linear, 20000, 0
#    Математическая модель и ее коэфициенты зависимости смещения
#    микрошагов шагового двигателя от величины измеренных колебаний.
max_step_size: 3
#    Максимальное количество микрошагов на которые мотор может
#    передвинуться за раз, для достижения планируемой магнитуды.
axes_steps_diff: 4
#    Разница позиций моторов в микрошагах между двумя осями, для
#    актуализации магнитуды вторичной оси. Используется в методе
#    synchronous, или в процессе выравнивания осей в методе alternately.
#    Типичное значение - max_step_size + 1.
#retry_tolerance: 0
#    Принудительный порог, до которого пара шаговых двигателей на одном
#    ремне, должна будет опустить величину колебаний. Рекомендуется к
#    настройке, дабы фильтровать возможные ошибки измерений. После
#    нескольких итераций запуска синхронизации вы найдете порог, до
#    которого можно опустить значение этого параметра.
#retries: 0
#    Максимальное количество повторений для достижения принудительного
#    порога колебаний.
head_fan: hotend_fan
#    Вентилятор хотенда, который будет выключаться на время синхронизации
#    для исключения его шумов.


[gcode_macro LOAD_FILAMENT]
variable_load_distance:  75
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=load_state
    G91
    G92 E0
    G1 E{load_distance} F{max_velocity} # fast-load
    G1 E{purge_distance} F{speed} # purge
    RESTORE_GCODE_STATE NAME=load_state

[gcode_macro UNLOAD_FILAMENT]
variable_unload_distance:  25
variable_purge_distance:  25
gcode:
    {% set speed = params.SPEED|default(300) %}
    {% set max_velocity = printer.configfile.settings['extruder'].max_extrude_only_velocity  * 60 %}
    SAVE_GCODE_STATE NAME=unload_state
    G91
    G92 E0
    G1 E{purge_distance} F{speed} # purge
    G1 E-{unload_distance} F{max_velocity} # fast-unload
	G1 E-80 F{speed}
    RESTORE_GCODE_STATE NAME=unload_state


####################################################################################
##                               Bed Leveling and Height Calibration Macro
####################################################################################

[gcode_macro MESH_CALIBRATE]
gcode:
        BED_MESH_CLEAR
        G28 XY
        #STOP_LED_EFFECTS
        #SET_LED_EFFECT EFFECT=nagrev_stol
        M190 S100
        #STOP_LED_EFFECTS
        #SET_LED_EFFECT EFFECT=nagrev_soplo
        M109 S150
        #STOP_LED_EFFECTS
        #SET_LED_EFFECT EFFECT=clean_nozzle_led
        #CLEAN_NOZZLE
        #STOP_LED_EFFECTS
        #SET_LED_EFFECT EFFECT=mesh_leds
        Z_TILT_ADJUST
        G28 Z
        BED_MESH_CALIBRATE
        #STOP_LED_EFFECTS
        #SET_LED_EFFECT EFFECT=portal_leds
        status_printing
        G28
#--------------------------------------------------------------------
[gcode_macro DRAW_LINES]
gcode:
    G90                           # Absolute positioning
    # G92 E0                      # Reset Extruder (commented out for now)
    # G1 Z5.0  F7200              # Move Z Axis up (commented out for now)
    G1 X50  Y2         F7200      # Move to start position
    M83                           # Set extruder to relative mode
    G1 E15 F400                   # Extrude filament
    G1 Z0.28 F7200                # Lower Z axis
    G1 X200 Y2   Z0.28 F1200 E17  # Draw the first line
    G1 X200 Y2.4 Z0.28 F2400      # Move to side a little
    G1 X55  Y2.4 Z0.28 F1200 E34  # Draw the second line
    G92 E0                        # Reset Extruder
    G90                           # Return to absolute positioning

[gcode_macro PRINT_START] 
#   Use PRINT_START for the slicer starting script - please customise for your slicer of choice
gcode:
    {% set bed = params.BED|default(50)|float %}
    {% set extruder = params.EXTRUDER|default(208)|float %}
	
    {% if bed > 100 %}
      SET_FAN_SPEED FAN=exhaust_fan SPEED=0.5
    {% endif %}
	M190 S{bed} 
    G28
    Z_TILT_ADJUST
    
    SET_DISPLAY_TEXT MSG="Bed Mesh Calibration"
    BED_MESH_CLEAR
	BED_MESH_CALIBRATE
    BED_MESH_PROFILE LOAD=default   
	SYNC_MOTORS
    M109 S150
    CLEAN_NOZZLE
    
    SET_DISPLAY_TEXT MSG="Calibrating Z Offset" 
    G28 Z
    CARTO_TOUCH
    G90
	G92 E0                           # Reset Extruder
    G1 Z10 F3000              
    G1 X275 Y300 F9000
    M109 S{extruder}
	DRAW_LINES
    
    
#--------------------------------------------------------------------
[gcode_macro PRINT_END]
gcode:
    {% set th = printer.toolhead %}
    {% set x_safe = th.position.x + 20 * (1 if th.axis_maximum.x - th.position.x > 20 else -1) %}
    {% set y_safe = th.position.y + 20 * (1 if th.axis_maximum.y - th.position.y > 20 else -1) %}
    {% set z_safe = [th.position.z + 2, th.axis_maximum.z]|min %}
    
    SAVE_GCODE_STATE NAME=STATE_PRINT_END

    M400                           ; wait for buffer to clear
    G92 E0                         ; zero the extruder
    G1 E-2.0 F3600                 ; retract filament
    
    TURN_OFF_HEATERS
    
    G90                                      ; absolute positioning
    G0 X{x_safe} Y{y_safe} Z{z_safe} F20000  ; move nozzle to remove stringing
    G0 X{th.axis_maximum.x//2} Y{th.axis_maximum.y - 2} F3600  ; park nozzle at rear
    M107                                     ; turn off fan
    SET_FAN_SPEED FAN=fan0 SPEED=0
	SET_FAN_SPEED FAN=exhaust_fan SPEED=0
    SET_FAN_SPEED FAN=fan2 SPEED=0
   # SET_FAN_SPEED FAN=fan3 SPEED=0

    
    BED_MESH_CLEAR

    # The purpose of the SAVE_GCODE_STATE/RESTORE_GCODE_STATE
    # command pair is to restore the printer's coordinate system
    # and speed settings since the commands above change them.
    # However, to prevent any accidental, unintentional toolhead
    # moves when restoring the state, explicitly set MOVE=0.
    RESTORE_GCODE_STATE NAME=STATE_PRINT_END MOVE=0
#--------------------------------------------------------------------
[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
  {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer.toolhead.axis_maximum.z|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% if act_z < (max_z - 2.0) %}
      {% set z_safe = 2.0 %}
  {% else %}
      {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  PAUSE_BASE
  G91
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G1 E-{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  {% if "xyz" in printer.toolhead.homed_axes %}
    G1 Z{z_safe} F900
    G90
    G1 X{x_park} Y{y_park} F6000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %} 
#--------------------------------------------------------------------
[gcode_macro RESUME]
description: Resume the actual running print
rename_existing: RESUME_BASE
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro PAUSE"].extrude|float %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY)  %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}  
  RESUME_BASE {get_params}
#--------------------------------------------------------------------

[gcode_macro CANCEL_PRINT]
# Defines a G-code macro to cancel the actual running print
description = Cancel the actual running print
rename_existing = CANCEL_PRINT_BASE
variable_park = True
gcode = 
    G28 Y                                     # Home Y axis
    _TOOLHEAD_PARK_PAUSE_CANCEL               # Call _TOOLHEAD_PARK_PAUSE_CANCEL macro
    TURN_OFF_HEATERS                          # Turn off all heaters
    CANCEL_PRINT_BASE                         # Call CANCEL_PRINT_BASE to cancel print
    SET_FAN_SPEED FAN=fan0 SPEED=0
    SET_FAN_SPEED FAN=fan2 SPEED=0
	SET_FAN_SPEED FAN=exhaust_fan SPEED=0
   # SET_FAN_SPEED FAN=fan3 SPEED=0

